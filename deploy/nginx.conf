worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    map $http_authorization $bearer_key {
        default "";
        ~*^Bearer\s+(.+)$ $1;
    }
    map $http_x_api_key $waha_key {
        default $http_x_api_key;
        "" $bearer_key;
    }
    map $waha_key $static_waha_key {
        default "";
        include /etc/nginx/agent-key.map;
    }
    map $static_waha_key $mcp_backend {
        default http://127.0.0.1:3030;
        "" http://127.0.0.1:3033;
    }
    server {
        listen 127.0.0.1:3031;
        location = /mcp {
            proxy_pass $mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header X-Api-Key $static_waha_key;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host localhost:3000;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_intercept_errors on;
            error_page 401 = @oauth_unauthorized;
        }
        location @oauth_unauthorized {
            add_header WWW-Authenticate 'Bearer resource_metadata="https://fiddler.minotaur-altered.ts.net:8443/.well-known/oauth-protected-resource"' always;
            default_type application/json;
            return 401 '{"error":"unauthorized"}';
        }
        location ~ ^/(\.auth/|\.idp/|\.well-known/) {
            proxy_pass http://127.0.0.1:3033;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Api-Key "";
        }
        location ^~ /api/files/ {
            if ($waha_key = "") { return 401; }
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:3030;
            proxy_set_header X-Api-Key $waha_key;
            proxy_set_header Authorization "";
            proxy_set_header Host localhost:3000;
        }
        location / { return 404; }
    }
}
